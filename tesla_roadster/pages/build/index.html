// Shared helpers + style registry for the style-frame explorations.
// Every style is a pure function of time: draw(ctx, W, H, t). Same t => same pixels.
(function () {
  const STYLES = (window.STYLES = window.STYLES || []);
  window.registerStyle = (s) => STYLES.push(s);

  const H = (window.H = {});

  // ---------- seeded randomness ----------
  // H.rng(seed) -> r() in [0,1). Extras: r.range(a,b), r.int(a,b), r.pick(arr), r.gauss(), r.chance(p)
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // ---------- gradient noise ----------
  // H.makeNoise(seed) -> { n2(x,y), n3(x,y,z), fbm2(x,y,oct), fbm3(x,y,z,oct) }  (outputs roughly -1..1)
  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    const fbm3 = (x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; } return s / norm; };
    const fbm2 = (x, y, oct = 4) => fbm3(x, y, 0.5, oct);
    return { n2, n3, fbm2, fbm3 };
  };

  // ---------- math ----------
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.map = (v, a, b, c, d) => c + ((v - a) / (b - a)) * (d - c);
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };

  // ---------- color ----------
  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.mix = (c1, c2, t) => { const a = Array.isArray(c1) ? c1 : H.hex(c1), b = Array.isArray(c2) ? c2 : H.hex(c2); return [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t); };

  // ---------- canvas utilities ----------
  // Offscreen canvas of the same logical size (use for layers, masks, compositing).
  H.layer = (W, H_, ) => { const c = document.createElement('canvas'); c.width = W; c.height = H_; return c; };
  // Monochrome grain / film noise over the whole canvas. amount ~ 0.03-0.15
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      if (mono) { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      else { d[i] += (r() - 0.5) * k; d[i + 1] += (r() - 0.5) * k; d[i + 2] += (r() - 0.5) * k; }
    }
    ctx.putImageData(img, 0, 0);
  };
  // Paper-ish texture tile: fills with base color + fibrous noise (cheap; drawn into ctx).
  H.paper = function (ctx, W, Hh, base = '#f3ecdc', seed = 3, strength = 0.06) {
    ctx.save(); ctx.fillStyle = base; ctx.fillRect(0, 0, W, Hh);
    const nz = H.makeNoise(seed), cell = 4, [br, bg, bb] = H.hex(base);
    for (let y = 0; y < Hh; y += cell) for (let x = 0; x < W; x += cell) {
      const v = nz.fbm2(x * 0.01, y * 0.01, 3) * 0.6 + nz.n2(x * 0.15, y * 0.04) * 0.4;
      const s = 1 + v * strength * 2;
      ctx.fillStyle = `rgb(${br * s | 0},${bg * s | 0},${bb * s | 0})`; ctx.fillRect(x, y, cell, cell);
    }
    ctx.restore();
  };
  // Vignette
  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
    ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); ctx.restore();
  };

  // ---------- rendering entry ----------
  // Renders style into canvas at logical 1280x720 (canvas can be any pixel size; it is scaled).
  H.W = 1280; H.H = 720;
  H.loadFonts = async function (style) {
    const specs = style.fonts || [];
    try { const sample = 'AaZz09' + (window.FONT_SAMPLE || '');
      await Promise.all(specs.map((f) => document.fonts.load(f, sample))); await document.fonts.ready; } catch (e) { /* render anyway */ }
  };
  H.render = function (style, canvas, t) {
    const ctx = canvas.getContext('2d', { willReadFrequently: !!style.readsPixels });
    const sx = canvas.width / H.W, sy = canvas.height / H.H;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(sx, sy);
    style.draw(ctx, H.W, H.H, t == null ? style.frameT || 0 : t);
    ctx.restore();
  };
})();
</script>
<script>
// ---- style kit: extracted verbatim from references/flat-space.js (lines 3-21, 36-253, 405-467, 739-743) ----
  // ---------- Flat-vector science explainer: deep space gradients, chunky shaded balls, crescent shadows, glows ----------
  const TAU = Math.PI * 2;
  const cl = H.clamp, lerp = H.lerp;
  const seg = (t, a, b) => cl((t - a) / (b - a));
  const eo = H.ease.out, eio = H.ease.inOut;
  // gentle overshoot
  const back = (u, s = 1.5) => { if (u <= 0) return 0; if (u >= 1) return 1; return 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2); };
  const FONT = '"Nunito", "Fredoka", sans-serif';
  const F = (w, px) => `${w} ${px}px ${FONT}`;

  const C = {
    sky0: '#090b2c', sky1: '#18134f', sky2: '#3a1a6c',
    ink: '#141846', visor: '#10164a',
    teal: ['#a4fbef', '#3ccbdc', '#1d64b0'],
    orange: ['#ffcc7a', '#ff8d3f', '#d24a2a'],
    tan: ['#ffe9be', '#ecb676', '#b4723c'],
    yellow: '#ffd23f', pink: '#ff5d8f', red: '#ff3b5c', green: '#38e08e', cyan: '#56e8ff', violet: '#8b5cff',
  };

  // ---------- small helpers ----------
  function rr(x, X, Y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r);
    x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath();
  }
  function glow(x, cx, cy, r, col, a) {
    if (a <= 0 || r <= 0) return;
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, H.rgba(col, a)); g.addColorStop(0.35, H.rgba(col, a * 0.4)); g.addColorStop(1, H.rgba(col, 0));
    x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill();
  }
  function spark(x, cx, cy, r, col, a) {
    if (a <= 0 || r <= 0) return;
    x.save(); x.globalAlpha *= a; x.fillStyle = col; x.beginPath();
    x.moveTo(cx, cy - r); x.quadraticCurveTo(cx, cy, cx + r, cy); x.quadraticCurveTo(cx, cy, cx, cy + r);
    x.quadraticCurveTo(cx, cy, cx - r, cy); x.quadraticCurveTo(cx, cy, cx, cy - r); x.fill(); x.restore();
  }
  // region of circle (cx,cy,r) NOT covered by the same circle shifted by (dx,dy)
  function crescent(x, cx, cy, r, dx, dy, fill) {
    x.save(); x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.clip();
    x.beginPath(); x.rect(cx - r - 2, cy - r - 2, 2 * r + 4, 2 * r + 4); x.arc(cx + dx, cy + dy, r * 1.02, 0, TAU);
    x.fillStyle = fill; x.fill('evenodd'); x.restore();
  }
  // the core flat-vector ball: multi-stop gradient, two stepped flat shadow crescents, rim highlight
  function ball(x, cx, cy, r, col, o = {}) {
    if (r <= 0.3) return;
    const la = o.la == null ? -2.25 : o.la, lx = Math.cos(la), ly = Math.sin(la);
    const g = x.createLinearGradient(cx + lx * r, cy + ly * r, cx - lx * r, cy - ly * r);
    g.addColorStop(0, col[0]); g.addColorStop(0.45, col[1]); g.addColorStop(1, H.rgba(H.mix(col[1], col[2], 0.6)));
    x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill();
    if (o.inner) { x.save(); x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.clip(); o.inner(); x.restore(); }
    const sh = o.sh == null ? 0.3 : o.sh;
    crescent(x, cx, cy, r, lx * r * sh, ly * r * sh, H.rgba(col[2], o.sha == null ? 0.5 : o.sha));
    crescent(x, cx, cy, r, lx * r * sh * 2.2, ly * r * sh * 2.2, H.rgba(col[2], (o.sha == null ? 0.5 : o.sha) * 0.45));
    crescent(x, cx, cy, r, -lx * r * 0.075, -ly * r * 0.075, H.rgba(o.rim || '#ffffff', o.rima == null ? 0.42 : o.rima));
  }
  const bez = (P, u) => { const v = 1 - u; return [v * v * v * P[0][0] + 3 * v * v * u * P[1][0] + 3 * v * u * u * P[2][0] + u * u * u * P[3][0], v * v * v * P[0][1] + 3 * v * v * u * P[1][1] + 3 * v * u * u * P[2][1] + u * u * u * P[3][1]]; };
  // rounded dotted / solid arrow along a cubic, drawn on to `prog`
  function arrow(x, P, prog, col, lw, o = {}) {
    if (prog <= 0) return;
    const n = 48, a = o.a == null ? 1 : o.a;
    x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.fillStyle = col; x.lineWidth = lw; x.lineCap = 'round'; x.lineJoin = 'round';
    if (o.dots) x.setLineDash([0.01, lw * 1.9]);
    x.beginPath(); const p0 = bez(P, o.from || 0); x.moveTo(p0[0], p0[1]);
    for (let i = 1; i <= n; i++) { const u = (o.from || 0) + ((prog - (o.from || 0)) * i) / n; const p = bez(P, u); x.lineTo(p[0], p[1]); }
    x.stroke(); x.setLineDash([]);
    if (o.head !== false && prog > 0.08) {
      const e = bez(P, prog), e0 = bez(P, prog - 0.02), ang = Math.atan2(e[1] - e0[1], e[0] - e0[0]), hs = lw * 1.5 * cl(prog * 5);
      x.translate(e[0], e[1]); x.rotate(ang); x.beginPath(); x.moveTo(hs * 1.1, 0); x.lineTo(-hs * 0.8, hs); x.lineTo(-hs * 0.8, -hs); x.closePath();
      x.lineWidth = lw * 0.7; x.fill(); x.stroke();
    }
    x.restore();
  }
  // flat text with a darker offset "long shadow"
  function text(x, s, cx, cy, px, col, o = {}) {
    x.save(); x.font = F(o.w || 900, px); x.textAlign = o.align || 'center'; x.textBaseline = 'middle';
    x.globalAlpha *= o.a == null ? 1 : o.a;
    x.fillStyle = o.shadow || 'rgba(10,8,46,0.55)'; x.fillText(s, cx + px * 0.03, cy + px * 0.07);
    x.fillStyle = col; x.fillText(s, cx, cy); x.restore();

  else if (kind === 'mug') { x.fillStyle = '#e8eaf5'; rr(x, p[0] - 2, p[1] - 3, 4, 4.6, 0.8); x.fill(); x.strokeStyle = '#e8eaf5'; x.lineWidth = 0.7; x.beginPath(); x.arc(p[0] + 2.1, p[1] - 0.8, 1.1, -1.3, 1.3); x.stroke(); }
  x.restore();
}

// ---- head (local frame, facing right when mirrored; t = |sin(head yaw)|)
function humanHead(x, hc, t, rear, exName, o) {
  const E = EXPR[exName] || EXPR.neutral, prof = t > 0.78, fy = -(o.headUp || 0) * 1.8;
  const headPath = () => x.ellipse(hc[0], hc[1], 8.7 * (1 - 0.08 * t), 9.5, 0, 0, TAU);
  const E2 = (cx, cy, rx, ry, rot) => { x.moveTo(cx + rx * Math.cos(rot), cy + rx * Math.sin(rot)); x.ellipse(cx, cy, rx, ry, rot, 0, TAU); };
  const fx = hc[0] + t * 4.2;
  if (!rear && t < 0.6) for (const sd of [-1, 1]) ball(x, hc[0] + sd * 8.3 * (1 - 0.4 * t) - t * 1.5, hc[1] + 1 + fy * 0.3, 1.8, HUM.skin, { sha: 0.4, la: HLA, rima: 0.2 });
  flatShade(x, headPath, HUM.skin, 1.1, true, [hc[0], hc[1], 9]);
  if (!rear && prof) ball(x, hc[0] + 7.7, hc[1] + 2 + fy, 1.3, HUM.skin, { sha: 0.3, la: HLA, rima: 0.2 });
  if (!rear && t >= 0.6) ball(x, hc[0] - 2.6, hc[1] + 1, 1.9, HUM.skin, { sha: 0.45, la: HLA, rima: 0.2 });
  const hx = hc[0] - t * 1.3, hy = hc[1];
  const hairPath = () => {
    if (rear) E2(hc[0] - t * 1.6, hy - 0.6, 9.1, 9.8, 0); else E2(hx, hy - 6, 9.3, 4.7, 0);
    E2(hx - 5, hy - 9, 3.5, 2.8, -0.4); E2(hx - 1.2, hy - 10.4, 3.7, 2.9, 0.1); E2(hx + 3, hy - 9.8, 3.5, 2.7, 0.4); E2(hx + 6.6, hy - 7.6, 2.7, 2.4, 0.7);
    if (!rear) {
      for (const k of [-5.6, -2.8, 0, 2.8, 5.4]) E2(fx + k * (1 - 0.4 * t), hy - 4.4 + Math.abs(k) * 0.12 + fy * 0.5, 1.95, 3.4, -0.45 - t * 0.25);
      if (t < 0.5) { E2(hc[0] - 7.7 * (1 - 0.4 * t) - t, hy - 2.5, 1.8, 3.2, 0.15); E2(hc[0] + 7.7 * (1 - 0.4 * t) - t, hy - 2.5, 1.8, 3.2, -0.15); }
      else E2(hc[0] - 4.9, hy - 3, 4.3, 5.5, 0.3);
    }
  };
  flatShade(x, hairPath, HUM.hair, 0.9, false);
  x.save(); x.beginPath(); hairPath(); x.clip(); x.fillStyle = H.rgba(HUM.hair[0], 0.45);
  x.beginPath(); x.ellipse(hx - 3.2, hy - 9.8, 3.6, 1.3, -0.35, 0, TAU); x.fill(); x.beginPath(); x.ellipse(hx + 1.4, hy - 11, 2.2, 0.9, 0.1, 0, TAU); x.fill(); x.restore();
  if (rear) { if (t > 0.3) ball(x, hc[0] + 7.9, hc[1] + 1.5, 1.8, HUM.skin, { sha: 0.45, la: HLA, rima: 0.2 }); return; }
  const look = o.look || E.look || [0, 0], ey = hc[1] + 0.9 + fy;
  const eyes = prof ? [[fx - 0.4, 1]] : [[fx - 3.2 * (1 - 0.3 * t), -1], [fx + 3.2 * (1 - 0.3 * t), 1]];
  for (const [exx, sd] of eyes) {
    const kind = E.eye === 'wink' ? (sd > 0 ? 'happy' : 'open') : E.eye, sc = !prof && sd < 0 ? 1 - 0.35 * t : 1;
    x.save(); x.translate(exx + look[0] * 0.55, ey + look[1] * 0.45); x.scale(sc, 1);
    if (kind === 'happy') { x.strokeStyle = HUM.ink; x.lineWidth = 0.75; x.lineCap = 'round'; x.beginPath(); x.arc(0, 0.7, 1.3, Math.PI * 1.15, Math.PI * 1.85); x.stroke(); }
    else {
      const big = kind === 'wide' ? 1.25 : 1; x.scale(1, 1 - 0.9 * (o.blink || 0));
      x.fillStyle = HUM.ink; x.beginPath(); x.ellipse(0, 0, 1.08 * big, 1.5 * big, 0, 0, TAU); x.fill();
      x.fillStyle = '#ffffff'; x.beginPath(); x.arc(-0.35 * big, -0.5 * big, 0.4 * big, 0, TAU); x.fill();
      if (kind === 'tired') { x.fillStyle = HUM.skin[1]; x.fillRect(-1.6, -2.2, 3.2, 2.1); x.strokeStyle = HUM.ink; x.lineWidth = 0.45; x.beginPath(); x.moveTo(-1.3, -0.1); x.lineTo(1.3, -0.1); x.stroke(); }
    }
    x.restore();
    const bw = E.brow[sd < 0 ? 0 : 1], by0 = ey - 3.0 + bw[0], inner = prof ? 1 : -sd;
    x.save(); x.strokeStyle = HUM.hair[2]; x.lineWidth = 0.85; x.lineCap = 'round'; x.beginPath();
    x.moveTo(exx + inner * 1.5 * sc, by0 + bw[1] * 0.6); x.lineTo(exx - inner * 1.6 * sc, by0 - bw[1] * 0.6); x.stroke(); x.restore();
  }
  if (!prof) { x.save(); x.strokeStyle = HUM.skin[2]; x.lineWidth = 0.55; x.lineCap = 'round'; x.beginPath(); x.arc(fx + t * 1.6, ey + 2.1, 0.7, 0.1 * Math.PI, 0.9 * Math.PI); x.stroke(); x.restore(); }
  const mx = prof ? fx + 0.8 : fx + t * 0.6, my = hc[1] + 5.3 + fy;
  x.save(); x.lineCap = 'round'; x.strokeStyle = HUM.ink; x.lineWidth = 0.55; x.fillStyle = HUM.mouth;
  if (E.mouth === 'smile') { x.beginPath(); x.arc(mx, my - 1.2, 1.7, 0.25 * Math.PI, 0.75 * Math.PI); x.stroke(); }
  else if (E.mouth === 'grin' || E.mouth === 'open') {
    const d = E.mouth === 'open' ? 3.6 : 2.4, w2 = 2.3 * (prof ? 0.6 : 1);
    x.beginPath(); x.moveTo(mx - w2, my - 0.6); x.quadraticCurveTo(mx, my - 1.0, mx + w2, my - 0.6);
    x.quadraticCurveTo(mx + w2 * 0.6, my - 0.6 + d, mx, my - 0.6 + d); x.quadraticCurveTo(mx - w2 * 0.6, my - 0.6 + d, mx - w2, my - 0.6); x.fill();
    x.save(); x.clip(); x.fillStyle = '#ffffff'; x.fillRect(mx - w2, my - 1.2, w2 * 2, 0.95); x.fillStyle = HUM.tongue; x.beginPath(); x.ellipse(mx, my - 0.6 + d, w2 * 0.55, d * 0.4, 0, 0, TAU); x.fill(); x.restore();
  }
  else if (E.mouth === 'o') { x.beginPath(); x.ellipse(mx, my, 0.9, 1.25, 0, 0, TAU); x.fill(); }
  else if (E.mouth === 'frown') { x.beginPath(); x.arc(mx, my + 1.3, 1.6, 1.2 * Math.PI, 1.8 * Math.PI); x.stroke(); }
  else if (E.mouth === 'flat') { x.beginPath(); x.moveTo(mx - 1.3, my); x.lineTo(mx + 1.3, my); x.stroke(); }
  else if (E.mouth === 'side') { x.beginPath(); x.moveTo(mx - 0.6, my + 0.2); x.quadraticCurveTo(mx + 0.6, my + 0.3, mx + 1.7, my - 0.4); x.stroke(); }
  else if (E.mouth === 'squiggle') { x.beginPath(); x.moveTo(mx - 1.6, my); x.quadraticCurveTo(mx - 0.8, my - 0.8, mx, my); x.quadraticCurveTo(mx + 0.8, my + 0.8, mx + 1.6, my); x.stroke(); }
  if (E.blush) { x.fillStyle = H.rgba(HUM.blush, 0.35); for (const [bx] of eyes) { x.beginPath(); x.ellipse(bx + (prof ? 0.5 : 0), ey + 2.7, 1.3, 0.7, 0, 0, TAU); x.fill(); } }
  x.restore();
}

// ---- PARTS: each draws one piece of a rig R between its named joints (in body units; person() sets up the scale)
const PART = {
  thigh(x, R, k) { limbStroke(x, [R.S['hip' + k], R.S['knee' + k]], 7.6, HUM.jeans); },
  shin(x, R, k) { limbStroke(x, [R.S['knee' + k], R.S['ankle' + k]], 7.2, HUM.jeans); },
  leg(x, R, k) { limbStroke(x, [R.S['hip' + k], R.S['knee' + k], R.S['ankle' + k]], 7.4, HUM.jeans); PART.shoe(x, R, k); },
  shoe(x, R, k) {
    const a = R.S['ankle' + k], dirS = R.sn >= 0 ? 1 : -1, len = 6.6 + 3.6 * Math.abs(R.sn);
    x.save(); x.translate(a[0], a[1] + BODY.ankle); x.scale(dirS, 1); setLight(dirS < 0);
    flatShade(x, () => rr(x, -3.3, -4.2, len, 4.2, 2), HUM.shoe, 0.55); x.fillStyle = HUM.shoe[2]; x.fillRect(-2.7, -1.1, len - 1.2, 1.1);
    x.restore(); setLight(false);
  },
  upperArm(x, R, k) { limbStroke(x, [R.S['shoulder' + k], R.S['elbow' + k]], 5.8, HUM.hood); },
  forearm(x, R, k) { limbStroke(x, [R.S['elbow' + k], R.S['wrist' + k]], 5.4, HUM.hood); PART.cuff(x, R, k); },
  arm(x, R, k) { limbStroke(x, [R.S['shoulder' + k], R.S['elbow' + k], R.S['wrist' + k]], 5.6, HUM.hood); PART.cuff(x, R, k); },
  cuff(x, R, k) { const w = R.S['wrist' + k], e = R.S['elbow' + k], d = Math.atan2(w[1] - e[1], w[0] - e[0]); x.fillStyle = HUM.hood[2]; x.beginPath(); x.arc(w[0] - Math.cos(d) * 1.1, w[1] - Math.sin(d) * 1.1, 2.7, 0, TAU); x.fill(); },
  hand(x, R, k, shape) { return drawHand(x, R, k, shape || R.P['hand' + k]); },
  neck(x, R) { const n = R.S.neck, h = R.S.head; limbStroke(x, [n, [lerp(n[0], h[0], 0.5), lerp(n[1], h[1], 0.5)]], 4.6, HUM.skin); },
  // the torso and hood live in a local frame: pelvis origin, spine up, mirrored when he faces left
  _torsoFrame(x, R, fn) {
    const P = R.S.pelvis, N = R.S.neck, len = Math.hypot(N[0] - P[0], N[1] - P[1]) / -BODY.neckY, mir = R.sn < 0;
    x.save(); x.translate(P[0], P[1]); x.rotate(R.spine); x.scale(mir ? -1 : 1, len); setLight(mir);
    fn(Math.abs(R.sn), 0.55 + 0.45 * Math.abs(R.cs)); x.restore(); setLight(false);
  },
  hood(x, R) { if (R.cs < -0.2) return; PART._torsoFrame(x, R, (t, w) => flatShade(x, () => x.ellipse(t * 1.5, BODY.neckY + 0.8, 8.6 * (0.6 + 0.4 * w), 3.8, 0, 0, TAU), HUM.hood, 0.6)); },
  torso(x, R) {
    PART._torsoFrame(x, R, (t, w) => {
      const tY = BODY.neckY, tx = t;
      const body = () => { const L = -13 * w + tx, Rr = 13 * w + tx; x.moveTo(L, -24); x.quadraticCurveTo(L, tY + 0.3, L + 5, tY); x.lineTo(Rr - 5, tY); x.quadraticCurveTo(Rr, tY + 0.3, Rr, -24); x.lineTo(Rr - 0.5 * w, 0.5); x.quadraticCurveTo(Rr - 0.5 * w, 3, Rr - 3, 3); x.lineTo(L + 3, 3); x.quadraticCurveTo(L + 0.5 * w, 3, L + 0.5 * w, 0.5); x.closePath(); };
      flatShade(x, body, HUM.hood, 1.6, true, [tx, -14, 16]);
      x.save(); x.beginPath(); body(); x.clip(); x.fillStyle = H.rgba(HUM.hood[2], 0.55); x.fillRect(-20, -0.2, 40, 3.4);
      if (R.cs > 0.2 && t < 0.8) {
        const zx = tx * 1.5 + t * 3.5, zw = 3.4 * (1 - 0.6 * t);
        x.fillStyle = HUM.tee; x.beginPath(); x.moveTo(zx - zw, tY - 0.5); x.quadraticCurveTo(zx, tY + 2.4, zx + zw, tY - 0.5); x.lineTo(zx + zw * 0.9, 3); x.lineTo(zx - zw * 0.9, 3); x.closePath(); x.fill();
        x.fillStyle = HUM.skin[1]; x.beginPath(); x.moveTo(zx - zw * 0.75, tY - 0.6); x.quadraticCurveTo(zx, tY + 1.8, zx + zw * 0.75, tY - 0.6); x.closePath(); x.fill();
        x.strokeStyle = H.rgba(HUM.hood[2], 0.8); x.lineWidth = 0.6; x.beginPath(); x.moveTo(zx - zw, tY); x.lineTo(zx - zw * 0.9, 3); x.moveTo(zx + zw, tY); x.lineTo(zx + zw * 0.9, 3); x.stroke();
        x.strokeStyle = HUM.shoe[1]; x.lineWidth = 0.55; x.lineCap = 'round'; x.beginPath(); x.moveTo(zx - zw - 0.8, tY + 1); x.lineTo(zx - zw - 1.0, tY + 7.5); x.moveTo(zx + zw + 0.8, tY + 1); x.lineTo(zx + zw + 1.0, tY + 7.5); x.stroke();
      }
      x.restore();
      if (R.cs < -0.2) { const hx = tx - t * 2; flatShade(x, () => { x.moveTo(-8 * w + hx, tY + 0.5); x.quadraticCurveTo(hx, tY + 18, 8 * w + hx, tY + 0.5); x.quadraticCurveTo(hx, tY - 3, -8 * w + hx, tY + 0.5); }, HUM.hood, 0.7); }
    });
  },
  head(x, R, o = {}) {
    const hp = R.S.head, hy = R.headYaw * D2R, t = Math.abs(Math.sin(hy)), rear = Math.cos(hy) < 0, mir = Math.sin(hy) < 0;
    const blink = o.blink != null ? o.blink : (o.t != null ? blinkAt(o.t, 0.7) : 0);
    x.save(); x.translate(hp[0], hp[1] + 8); x.rotate(R.spine + (R.P.tilt || 0)); x.translate(0, -8); if (mir) x.scale(-1, 1); setLight(mir);
    humanHead(x, [0, 0], t, rear, R.P.expr || 'neutral', { headUp: R.P.headUp, look: o.look || R.P.look, blink });
    x.restore(); setLight(false);
  },
  joint(x, p, r = 1.6, col = C.cyan) { glow(x, p[0], p[1], r * 3, col, 0.5); x.fillStyle = '#ffffff'; x.beginPath(); x.arc(p[0], p[1], r * 0.55, 0, TAU); x.fill(); x.strokeStyle = col; x.lineWidth = r * 0.35; x.beginPath(); x.arc(p[0], p[1], r, 0, TAU); x.stroke(); },
  // skeleton overlay for anatomy beats: which = 'R' | 'L' | 'arms' | 'all'; highlight = a joint name to pulse
  bones(x, R, which = 'arms', o = {}) {
    const S = R.S, chains = [];
    for (const k of ['R', 'L']) if (which === 'all' || which === 'arms' || which === k) chains.push(['shoulder' + k, 'elbow' + k, 'wrist' + k]);
    if (which === 'all') { chains.push(['neck', 'pelvis'], ['shoulderR', 'shoulderL'], ['hipR', 'hipL']); for (const k of ['R', 'L']) chains.push(['hip' + k, 'knee' + k, 'ankle' + k]); }
    x.save(); x.lineCap = 'round'; x.strokeStyle = H.rgba(o.col || '#9ff7ff', 0.9); x.lineWidth = o.lw || 1.2;
    for (const c of chains) { x.beginPath(); c.forEach((n, i) => (i ? x.lineTo(S[n][0], S[n][1]) : x.moveTo(S[n][0], S[n][1]))); x.stroke(); }
    for (const c of chains) for (const n of c) PART.joint(x, S[n], n === o.highlight ? 2.6 * (1 + 0.15 * Math.sin((R.t || 0) * 8)) : 1.4, n === o.highlight ? (o.hcol || C.yellow) : (o.col || C.cyan));
    x.restore();
  },
};

// draw a whole rig in depth order from the parts
function drawRig(x, R, o = {}) {
  const S = R.S, P = R.P, depth = (k, a, b, c) => (S[a + k][2] + S[b + k][2] + S[c + k][2]) / 3;
  const legs = ['R', 'L'].map((k) => ({ k, d: depth(k, 'hip', 'knee', 'ankle') })).sort((a, b) => a.d - b.d);
  const arms = ['R', 'L'].map((k) => ({ k, d: depth(k, 'shoulder', 'elbow', 'wrist') })).sort((a, b) => a.d - b.d);
  const behind = arms.filter((a) => a.d < -3), front = arms.filter((a) => a.d >= -3);
  const hold = (k) => P['hold' + k];
  const handPass = (k) => { const pre = drawHandProps(x, R, k, 'before'); const h = PART.hand(x, R, k); if (h && hold(k) === 'pen') heldProp(x, 'pen', h.grip, h.dir); return h || pre; };
  for (const a of behind) { PART.arm(x, R, a.k); handPass(a.k); }
  for (const l of legs) PART.leg(x, R, l.k);
  PART.hood(x, R); PART.neck(x, R); PART.torso(x, R); PART.head(x, R, o);
  for (const a of front) PART.arm(x, R, a.k);
  // tablets sit between the sleeves and the hands
  if (P.holdBoth === 'tablet') heldProp(x, 'tablet', [(S.wristR[0] + S.wristL[0]) / 2, (S.wristR[1] + S.wristL[1]) / 2 - 2], 0, { sketch: o.sketch });
  for (const k of ['R', 'L']) if (hold(k) === 'tablet') { const w = S['wrist' + k], sd = w[0] > S.pelvis[0] ? -1 : 1; heldProp(x, 'tablet', [w[0] + sd * 6.5, w[1] - 1.5], 0, { sketch: o.sketch }); }
  for (const a of front) handPass(a.k);
}
function drawHandProps(x, R, k, when) {
  if (when === 'before' && R.P['hold' + k] === 'phone') { const F = handFrame(R, k), g = F.at(2.8, 0.3); heldProp(x, 'phone', g, F.dir); }
  if (when === 'before' && R.P['hold' + k] === 'mug') { const F = handFrame(R, k), g = F.at(3.4, 0); heldProp(x, 'mug', g, F.dir); }
  return null;
}
// the whole presenter in world units. opts: everything rig() takes, plus t (breathing + auto blink), blink, look, a, noShadow, noGlow, sketch
function person(x, cx, cy, Hh, o = {}) {
  if (Hh < 4) return null;
  const u = Hh / 100, R = rig({ ...o, _world: { cx, cy, u } });
  x.save(); x.translate(cx, cy); x.scale(u, u); x.globalAlpha *= o.a == null ? 1 : o.a;
  setLight(false);
  if (!o.noGlow) glow(x, R.S.pelvis[0], -55 + BODY.sitDrop * (R.P.sit || 0) * 0.5, 62, '#8aa2ff', 0.16);
  if (!(R.P.sit > 0.5) && !o.noShadow) { // stays on the ground; shrinks and fades as he rises
    const mx = (R.S.ankleR[0] + R.S.ankleL[0]) / 2, k = 1 / (1 + (R.P.rise || 0) / 18);
    x.fillStyle = `rgba(8,6,40,${0.35 * k})`; x.beginPath(); x.ellipse(mx, 0.4, 14 * (0.75 + 0.25 * Math.abs(R.cs)) * (0.6 + 0.4 * k), 2.2 * (0.6 + 0.4 * k), 0, 0, TAU); x.fill();
  }
  drawRig(x, R, o);
  if (o.bones) PART.bones(x, R, o.bones, { highlight: o.boneHighlight });
  x.restore();
  return R;
}

// ---- props in the same shading
// laptop: s = base width (px). view 'side' (hinge right, screen faces left), 'back' (lid to camera, user behind it),
// 'screen' (screen to camera, user in front of it: over-the-shoulder). content(x, w, h) draws on the screen (0,0 = top-left).
function laptop(x, cx, cy, s, o = {}) {
  const SIL = o.col || ['#f2f4ff', '#b8bfe0', '#636a96'], v = o.view || 'side';   // o.col: [light, mid, dark] for contrast on light backgrounds
  setLight(!!o.flip); x.save(); x.translate(cx, cy); if (o.flip) x.scale(-1, 1);
  if (v === 'side') {
    flatShade(x, () => rr(x, -s / 2, -s * 0.05, s, s * 0.05, s * 0.02), SIL, s * 0.012);
    x.save(); x.translate(s / 2 - s * 0.03, -s * 0.045); x.rotate(-(o.open == null ? 1.42 : o.open));
    flatShade(x, () => rr(x, 0, -s * 0.022, s * 0.9, s * 0.044, s * 0.02), SIL, s * 0.01);
    if (o.screen !== false) { x.fillStyle = H.rgba(C.cyan, 0.9); x.fillRect(s * 0.05, -s * 0.03, s * 0.8, s * 0.012); glow(x, s * 0.45, -s * 0.06, s * 0.35, '#56e8ff', 0.25 * (o.glowA == null ? 1 : o.glowA)); }
    x.restore();
  } else if (v === 'back') {
    flatShade(x, () => rr(x, -s * 0.55, -s * 0.035, s * 1.1, s * 0.035, s * 0.015), SIL, s * 0.01);
    flatShade(x, () => rr(x, -s / 2, -s * 0.68, s, s * 0.64, s * 0.035), SIL, s * 0.016);
    glow(x, 0, -s * 0.36, s * 0.12, '#ffffff', 0.5); x.fillStyle = 'rgba(255,255,255,0.85)'; x.beginPath(); x.arc(0, -s * 0.36, s * 0.035, 0, TAU); x.fill(); // generic badge, not a brand logo
  } else {

// ---------------- the presenter ----------------
function presenter(x, cx, cy, h, t, pose, expr, o = {}) { return person(x, cx, cy, h, { view: '3/4', pose, expr, t, noGlow: true, ...o }); }

// ================= S1: hook on a sunset road (0 - 18.3) =================
const CAR2 = { cx: 0.62 * 1280, gy: 0.86 * 720, w: 0.5 * 1280 };

      const R = presenter(x, px, 0.93 * H_, 330, t, pose, t < 8.7 ? 'surprised' : t < 14.1 ? 'happy' : 'thinking');
      const qs = popAt(t, 14.2, 0.4) * (1 - S(t, 15.8, 16.1));

// ================= S2: the battery pack (18.3 - 48.4) =================
const GRID = { cols: 14, rows: 6, p: 66, r: 25, cx: 0.44 * 1280, cy: 0.575 * 720 };
const gpos = (i, j) => [GRID.cx + (i - (GRID.cols - 1) / 2) * GRID.p, GRID.cy + (j - (GRID.rows - 1) / 2) * GRID.p];
const GL = GRID.cx - (GRID.cols / 2) * GRID.p - 20, GR = GRID.cx + (GRID.cols / 2) * GRID.p + 20;
const runY = (k) => GRID.cy + (2 * k + 1 - GRID.rows / 2) * GRID.p;                // tube runs between rows 0|1, 2|3, 4|5
const TUBE = [[GL - 40, runY(0)], [GR, runY(0)], [GR, runY(1)], [GL, runY(1)], [GL, runY(2)], [GR + 40, runY(2)]];
const BAD = [9, 2];
function s2(x, W, H_, t) {
  bgFlat(x, W, H_, '#3b1aa8', '#1b0b5c', 0.5); softBlobs(x, W, H_, '#8b5cff', 3, t, 6);
  // A (18.3-23.6): E layout, the cell count over a dot matrix
  const aOut = 1 - eio(S(t, 23.0, 23.6));
  if (aOut > 0.01) {
    const em = 1 + 0.5 * (1 - eo(S(t, 18.3, 19.1))), pitch = W / 42, cols = 35, rows = 15, N = cols * rows, fillU = S(t, 18.6, 21.42);

      const i = k % cols, j = Math.floor(k / cols), X = 0.08 * W + (i + 0.5) * pitch, Y = 0.25 * H_ + (j + 0.5) * (0.65 * H_ / rows);

      x.fillStyle = 'rgba(200,255,240,0.7)'; x.beginPath(); x.arc(X - 3, Y - 3, 3.2 * s, 0, TAU); x.fill();
    }
    glow(x, W / 2, H_ / 2, 360, '#140850', 0.95);
    const v = Math.round(6831 * Math.pow(S(t, 19.04, 21.42), 1.5)), land = S(t, 21.42, 21.8), pop = 1 + 0.22 * Math.sin(Math.PI * land);
    if (t > 18.9) { x.save(); x.translate(W / 2, H_ * 0.48); x.scale(pop, pop); text(x, v.toLocaleString('en-US'), 0, 0, 140, land > 0 ? C.yellow : '#ffffff'); x.restore(); }
    if (land > 0) burst(x, W / 2, H_ * 0.48, land * 1.2, 31, 300);
    x.restore();
    labelTag(x, W / 2, 0.66 * H_, 'LITHIUM-ION CELLS', TAGC.cyan, { px: 30, s: popAt(t, 21.55, 0.35, 2) * aOut });
  }
  // B (23.4-26.9): D layout, one cell -> the laptops it came from
  const bS = popAt(t, 23.45, 0.45, 1.5) * (1 - eio(S(t, 26.4, 26.9)));
  if (bS > 0.01) {
    const c = [0.33 * W, 0.55 * H_];
    x.save(); x.translate(c[0], c[1]); x.scale(bS, bS); x.translate(-c[0], -c[1]); cellSide(x, c[0], c[1] + Math.sin(t * 1.8) * 5, 300, 1); x.restore();
    labelTag(x, c[0], 0.86 * H_, '18650 CELL', TAGC.cyan, { px: 28, ptr: 'up', s: popAt(t, 24.2, 0.35, 2) * (1 - S(t, 26.4, 26.7)) });
    const ls = popAt(t, 25.25, 0.4, 1.5) * (1 - eio(S(t, 26.4, 26.9)));
    if (ls > 0.01) { const lc = [0.69 * W, 0.74 * H_]; x.save(); x.translate(lc[0], lc[1]); x.scale(ls, ls); x.translate(-lc[0], -lc[1]); laptop(x, lc[0], lc[1], 330, { view: 'screen' }); x.restore(); }
    arrow(x, [[c[0] + 80, c[1] - 40], [c[0] + 200, c[1] - 150], [0.6 * W, 0.3 * H_], [0.66 * W, 0.4 * H_]], eio(S(t, 25.3, 25.9)), C.cyan, 9, { dots: true, a: 1 - S(t, 26.4, 26.7) });
  }
  // C (26.8-31.3): A layout, the pack as one battery that fills to 53 kWh (focal glow)
  const cS = popAt(t, 26.8, 0.45, 1.4) * (1 - eio(S(t, 30.9, 31.4)));
  if (cS > 0.01) {
    x.save(); x.translate(W / 2, H_ / 2); x.scale(cS, cS); x.translate(-W / 2, -H_ / 2);
    batteryIcon(x, W / 2, H_ / 2 + Math.sin(t * 1.6) * 4, 560, 270, eio(S(t, 27.3, 29.8)), { ga: 0.3 + 0.3 * S(t, 28.3, 29) });
    const ks = popAt(t, 28.35, 0.4, 1.8); if (ks > 0.01) { x.save(); x.translate(W / 2 - 14, H_ / 2); x.scale(ks, ks); text(x, '53 kWh', 0, 0, 104, '#ffffff'); x.restore(); }
    x.restore();
  }
  // D (31.0-48.4): the pack from above. Cells heat up, the cooling loop runs between them, the BMS checks every cell

    }
    // cooling tube with flowing coolant

      x.strokeStyle = '#56e8ff'; x.lineWidth = 12; x.beginPath(); pts.forEach((p, i) => (i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]))); x.stroke(); x.restore();

    }
    tagAt(x, t, 34.3, 39.9, GL + 90, GRID.cy - 3 * GRID.p - 46, 'COOLANT', TAGC.cyan, { ptr: 'down', rot: -0.04 });
    // thermometer: from hot to below 35 C
    const th = popAt(t, 37.1, 0.4) * (1 - S(t, 39.9, 40.3));

      x.save(); x.translate(chip[0], chip[1]); x.scale(cs, cs);
      glow(x, 0, 0, 120, '#8b5cff', 0.45); x.fillStyle = '#c9b3ff'; for (let k = 0; k < 6; k++) { rr(x, -70 + k * 26, -48, 10, 14, 3); x.fill(); rr(x, -70 + k * 26, 34, 10, 14, 3); x.fill(); }
      flatShade(x, () => rr(x, -85, -36, 170, 72, 14), ['#bda4ff', '#5b3cc4', '#241064'], 3);
      x.restore();
      labelTag(x, chip[0] + 170, chip[1], 'BMS', TAGC.violet, { px: 30, ptr: 'left', s: popAt(t, 41.0, 0.35, 2) * cs });
      const scan = S(t, 42.4, 44.6); if (scan > 0 && scan < 1) { const sx = lerp(GL, GR, scan); x.fillStyle = 'rgba(255,255,255,0.18)'; x.fillRect(sx - 30, top - 10, 60, GRID.rows * GRID.p + 20); glow(x, sx, GRID.cy, 120, '#ffffff', 0.15); }
      const bp = gpos(BAD[0], BAD[1]);
      arrow(x, [[chip[0] + 40, chip[1] + 40], [chip[0] + 160, chip[1] + 60], [bp[0] - 20, bp[1] - 120], [bp[0], bp[1] - 34]], eio(S(t, 45.5, 46.1)) * (1 - S(t, 47.2, 47.5)), C.cyan, 7, { dots: true });

// ================= S3: DC -> inverter -> AC (47.6 - 73.0) =================

    }

    const ms = popAt(t, 48.25, 0.4); if (ms > 0.01) { x.save(); x.translate(...MOTP); x.scale(ms, ms); x.translate(-MOTP[0], -MOTP[1]);
      motorIcon(x, MOTP[0], MOTP[1], 82, 2.4 * ramp(t - 63.6) + 5 * ramp(t - 66.3), 0.2 + 0.8 * S(t, 68.2, 69)); x.restore(); }

    badge(x, INVP[0], INVP[1], 34, false, back(S(t, 53.4, 53.7), 2.2) * (1 - S(t, 54.9, 55.2)));
    // scopes: DC flat line, AC wave, and the inverter's chopped pulses that smooth into the wave
    const sy = 0.24 * H_, ph = t * 0.35, m = eio(S(t, 61.9, 63.9));
    scopePanel(x, BATP[0], sy, 220, 120, () => 0.55, S(t, 50.8, 51.3), C.yellow, popAt(t, 50.62, 0.35));
    scopePanel(x, MOTP[0], sy, 220, 120, (u) => (t < 63.8 ? 0.8 : amp) * Math.sin(TAU * (2 * u - ph)), S(t, 52.95, 53.6), C.cyan, popAt(t, 52.8, 0.35));
    const pwm = (u) => { const q = (u * 16 - ph * 8) % 1, duty = 0.5 + 0.45 * Math.sin(TAU * (2 * u - ph)); return (((q + 1) % 1) < duty ? 0.8 : -0.8); };
    scopePanel(x, INVP[0], sy, 220, 120, (u) => lerp(pwm(u), 0.8 * amp * Math.sin(TAU * (2 * u - ph)), m), S(t, 59.1, 59.8), m > 0.5 ? C.cyan : '#ffe680', popAt(t, 58.9, 0.35));
    labelTag(x, BATP[0], sy + 96, 'DC', TAGC.orange, { px: 30, ptr: 'up', s: popAt(t, 50.9, 0.35, 2) });
    labelTag(x, MOTP[0], sy + 96, 'AC', TAGC.cyan, { px: 30, ptr: 'up', s: popAt(t, 53.0, 0.35, 2) });
    labelTag(x, INVP[0], 0.78 * H_, 'INVERTER', TAGC.pink, { px: 30, ptr: 'up', s: popAt(t, 57.05, 0.35, 2) });
    pedal(x, 0.1 * W, 0.86 * H_, 90, eio(S(t, 64.9, 65.6)), popAt(t, 64.4, 0.4));
  });
}

// ================= S4: inside the motor (73.0 - 78.9) =================
function s4(x, W, H_, t) {
  bgFlat(x, W, H_, '#22105e', '#0e0838', 0.5); softBlobs(x, W, H_, '#6a3cff', 4, t, 5);
  const em = 1 + 0.45 * (1 - eo(S(t, 73.0, 73.8))), c = [W / 2, H_ / 2], on = S(t, 74.6, 75.2), phi = 2.8 * ramp(t - 74.8) - 0.4, rot = 2.5 * ramp(t - 76.5);
  x.save(); x.translate(...c); x.scale(em, em); x.translate(-c[0], -c[1]);
  glow(x, c[0], c[1], 380, '#8b5cff', 0.3);
  // stator ring (evenodd hole) with 12 copper coils; the coils facing the field angle light up
  const g = x.createLinearGradient(c[0] - 250, c[1] - 250, c[0] + 250, c[1] + 250); g.addColorStop(0, '#c9cdf2'); g.addColorStop(0.5, '#7076b8'); g.addColorStop(1, '#2a2e66');
  x.fillStyle = 'rgba(10,8,46,0.4)'; x.beginPath(); x.arc(c[0] + 8, c[1] + 14, 252, 0, TAU); x.fill();
  x.fillStyle = g; x.beginPath(); x.arc(c[0], c[1], 250, 0, TAU); x.arc(c[0], c[1], 192, 0, TAU, true); x.fill();
  for (let k = 0; k < 12; k++) {
    const a = (k * TAU) / 12, b = on * Math.pow(Math.max(0, Math.cos(a - phi)), 3), X = c[0] + Math.cos(a) * 168, Y = c[1] + Math.sin(a) * 168;
    if (b > 0.05) glow(x, X, Y, 90, '#ffd23f', 0.75 * b);
    x.save(); x.translate(X, Y); x.rotate(a);
    x.fillStyle = '#7076b8'; rr(x, -26, -14, 52, 28, 6); x.fill();
    x.fillStyle = H.rgba(H.mix('#ff9a4a', '#fff1a0', b), 1); rr(x, -20, -24, 34, 48, 10); x.fill();
    x.strokeStyle = 'rgba(120,50,20,0.35)'; x.lineWidth = 2; for (let q = -16; q <= 16; q += 8) { x.beginPath(); x.moveTo(-20, q); x.lineTo(14, q); x.stroke(); }
    x.restore();
  }
  // rotor: drawn turning (lags the field)
  ball(x, c[0], c[1], 132, ['#e4e2ff', '#8f8ad0', '#38327a'], { sha: 0.45 });
  x.strokeStyle = 'rgba(255,255,255,0.45)'; x.lineWidth = 9; x.lineCap = 'round';
  for (let k = 0; k < 14; k++) { const a = rot + (k * TAU) / 14; x.beginPath(); x.moveTo(c[0] + Math.cos(a) * 70, c[1] + Math.sin(a) * 70); x.lineTo(c[0] + Math.cos(a) * 118, c[1] + Math.sin(a) * 118); x.stroke(); }
  ball(x, c[0], c[1], 30, ['#ffffff', '#c9c5ee', '#5a5498'], { sha: 0.4 });
  // the field's direction: a curved arrow riding ahead of the lit coils
  if (on > 0.01) arrow(x, arcPts(c, 290, phi - 0.75, phi + 0.05), on, C.cyan, 12, { a: on });
  x.restore();
  labelTag(x, 0.85 * W, 0.24 * H_, 'MAGNETIC\nFIELD', TAGC.cyan, { px: 28, s: popAt(t, 75.3, 0.35, 2) });
  labelTag(x, 0.15 * W, 0.7 * H_, 'ROTOR', TAGC.orange, { px: 30, ptr: 'right', s: popAt(t, 76.8, 0.35, 2) });
}

// ================= S4b: torque chart (78.0 - 88.3) =================
const fPet = (r) => 0.15 + 0.8 * Math.sin(Math.PI * Math.min(1, r * 0.85));
const fEl = (r) => (r < 0.45 ? 1 : 0.45 / r);
function chart(x, W, H_, t) {
  bgFlat(x, W, H_, '#fff4d8', '#ffe2b0', 0.3); softBlobs(x, W, H_, '#ffb86b', 12, t, 4);
  const O = [0.14 * W, 0.8 * H_], XW = 0.75 * W, YH = 0.58 * H_, P = (r, f) => [O[0] + r * XW, O[1] - f * YH];
  x.strokeStyle = '#3b2a63'; x.lineWidth = 7; x.lineCap = 'round';
  const ax = eio(S(t, 78.3, 78.9)); x.beginPath(); x.moveTo(O[0], O[1]); x.lineTo(O[0] + (XW + 30) * ax, O[1]); x.moveTo(O[0], O[1]); x.lineTo(O[0], O[1] - (YH + 40) * ax); x.stroke();
  const curve = (f, prog, col, lw) => { if (prog <= 0) return; x.save(); x.strokeStyle = 'rgba(60,30,90,0.25)'; x.lineWidth = lw; x.lineJoin = 'round'; x.beginPath();
    for (let i = 0; i <= 100 * prog; i++) { const p = P(i / 100, f(i / 100)); i ? x.lineTo(p[0] + 3, p[1] + 6) : x.moveTo(p[0] + 3, p[1] + 6); } x.stroke();
    x.strokeStyle = col; x.beginPath(); for (let i = 0; i <= 100 * prog; i++) { const p = P(i / 100, f(i / 100)); i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]); } x.stroke(); x.restore(); };
  curve(fPet, eio(S(t, 78.5, 80.6)), '#ff8a1f', 11);
  curve(fEl, eio(S(t, 83.0, 84.4)), '#1fb6ff', 13);
  // the petrol engine has to rev up: a dot climbs its curve
  const rv = eio(S(t, 79.65, 81.6)) * 0.59; if (t > 79.6 && t < 83.0) { const p = P(rv, fPet(rv)); glow(x, p[0], p[1], 60, '#ff8a1f', 0.6); ball(x, p[0], p[1], 14, ['#ffe0b0', '#ff8a1f', '#a33a1a'], { sha: 0.4 }); }
  // the electric motor is strong from the start (focal glow on the left end of its line)
  const st = S(t, 84.25, 84.8); if (st > 0) { const p = P(0.06, 1); glow(x, p[0], p[1], 110, '#1fb6ff', 0.7 * st * (0.75 + 0.25 * Math.sin(t * 6))); }
  const pk = P(0.59, fPet(0.59)), el = P(0.3, 1);
  labelTag(x, pk[0], pk[1] + 60, 'PETROL', TAGC.orange, { px: 30, ptr: 'up', s: popAt(t, 79.0, 0.35, 2) });
  labelTag(x, el[0], el[1] + 52, 'ELECTRIC', TAGC.cyan, { px: 30, ptr: 'up', s: popAt(t, 83.4, 0.35, 2) });
  labelTag(x, O[0] + XW - 30, O[1] + 46, 'RPM', TAGC.violet, { px: 28, s: popAt(t, 78.9, 0.35, 2) });
  labelTag(x, O[0] + 100, O[1] - YH - 66, 'TORQUE', TAGC.violet, { px: 28, s: popAt(t, 79.0, 0.35, 2) });
  labelTag(x, 0.85 * W, 0.2 * H_, 'CONCEPT', TAGC.pink, { px: 24, rot: 0.05, s: popAt(t, 79.4, 0.35, 2) });
}

// ================= S4c: 0-60 in 3.9 s (87.5 - 93.3) =================
function speedo(x, W, H_, t) {
  bgFlat(x, W, H_, '#ff8a3c', '#d9402e', 0.4); softBlobs(x, W, H_, '#ffd23f', 21, t, 5);
  const c = [0.36 * W, 0.56 * H_], R = 205, u = S(t, 88.38, 91.3), v = 60 * (1 - Math.pow(1 - u, 1.5)), ang = (s) => Math.PI * (0.75 + (1.5 * s) / 80);
  x.fillStyle = 'rgba(10,8,46,0.35)'; x.beginPath(); x.arc(c[0] + 8, c[1] + 14, R + 18, 0, TAU); x.fill();
  ball(x, c[0], c[1], R + 18, ['#5b4ab8', '#2a1a6e', '#120a3a'], { sha: 0.35 });
  x.lineCap = 'round'; x.strokeStyle = 'rgba(255,255,255,0.18)'; x.lineWidth = 22; x.beginPath(); x.arc(c[0], c[1], R - 30, ang(0), ang(80)); x.stroke();
  if (v > 0.2) { x.strokeStyle = '#ffd23f'; x.beginPath(); x.arc(c[0], c[1], R - 30, ang(0), ang(v)); x.stroke(); }
  x.fillStyle = '#ffffff'; x.font = F(900, 26); x.textAlign = 'center'; x.textBaseline = 'middle';
  for (let s = 0; s <= 80; s += 20) { const a = ang(s); x.fillText(String(s), c[0] + Math.cos(a) * (R - 78), c[1] + Math.sin(a) * (R - 78)); }
  const a = ang(v); x.strokeStyle = '#ff3b5c'; x.lineWidth = 10; x.beginPath(); x.moveTo(c[0] - Math.cos(a) * 20, c[1] - Math.sin(a) * 20); x.lineTo(c[0] + Math.cos(a) * (R - 46), c[1] + Math.sin(a) * (R - 46)); x.stroke();
  ball(x, c[0], c[1], 22, ['#ffffff', '#d9d4ff', '#5a5498'], { sha: 0.4 });
  labelTag(x, c[0], c[1] + 112, 'MPH', TAGC.violet, { px: 28, s: popAt(t, 88.0, 0.35, 2) });
  const land = S(t, 91.26, 91.6), pop = 1 + 0.22 * Math.sin(Math.PI * land), n = [0.67 * W, 0.53 * H_];
  flare(x, n[0], n[1], Math.max(0, 1 - Math.abs(t - 91.45) / 0.9) * (t > 91.26 ? 1 : 0), t);
  x.save(); x.translate(...n); x.scale(pop, pop); text(x, (3.9 * u).toFixed(1) + ' s', 0, 0, 120, land > 0 ? C.yellow : '#ffffff'); x.restore();
  if (land > 0) burst(x, n[0], n[1], land * 1.2, 44, 260);
  labelTag(x, n[0], 0.33 * H_, '0–60 MPH', TAGC.pink, { px: 30, ptr: 'down', s: popAt(t, 88.4, 0.35, 2) });
}

// ================= S5: regenerative braking (92.5 - 108.6) =================
const CAR5 = { cx: 0.5 * 1280, gy: 0.82 * 720, w: 0.62 * 1280 };
function regenScroll(t) { let s = 0; for (let tt = 92.5; tt < t; tt += 0.04) s += (620 - 470 * eio(S(tt, 93.7, 96.5))) * 0.04; return s; }
function s5(x, W, H_, t) {
  const sc = regenScroll(t), rev = S(t, 95.88, 96.3);
  road(x, W, H_, t, PAL.dusk, sc);
  roadster(x, CAR5.cx, CAR5.gy, CAR5.w, { t, spin: sc / (0.075 * CAR5.w), speed: 0.6 * (1 - S(t, 93.7, 95.5)), lights: 1, xray: 1, brake: S(t, 93.7, 94.0),
    flow: rev > 0.5 ? -1 : 1, flowCol: rev > 0.5 ? C.green : C.yellow, wheelGlow: S(t, 96.94, 97.3) * (1 - S(t, 99.0, 99.4)),
    glowMot: S(t, 99.24, 99.6) * (1 - S(t, 101.2, 101.5)), glowPem: S(t, 101.35, 101.7) * (1 - S(t, 102.7, 103.0)), glowBat: S(t, 102.8, 103.2) });
  const mp = carPt(CAR5, LOC.mot), bp = carPt(CAR5, LOC.bat);
  tagAt(x, t, 100.15, 106.0, mp[0], CAR5.gy - 0.3 * CAR5.w, 'GENERATOR', TG.green, { ptr: 'down' });
  // the battery gauge above the pack climbs as energy comes back
  const gS = popAt(t, 102.6, 0.4) * (1 - S(t, 107.9, 108.3));
  if (gS > 0.01) { const g = [bp[0] + 40, CAR5.gy - 0.36 * CAR5.w]; x.save(); x.translate(...g); x.scale(gS, gS); x.translate(-g[0], -g[1]); batteryIcon(x, g[0], g[1], 150, 72, lerp(0.55, 0.85, eio(S(t, 102.9, 104.2))), { ga: 0.45 }); x.restore(); }
  // inset: the energy is not burned off as heat in the brakes
  const hS = popAt(t, 104.2, 0.4) * (1 - S(t, 107.4, 107.8)), hc = [0.85 * W, 0.27 * H_];
  if (hS > 0.01) {
    x.save(); x.translate(...hc); x.scale(hS, hS);
    x.fillStyle = 'rgba(10,8,46,0.4)'; x.beginPath(); x.arc(6, 10, 92, 0, TAU); x.fill(); x.fillStyle = '#2a1650'; x.beginPath(); x.arc(0, 0, 92, 0, TAU); x.fill();
    glow(x, 0, 0, 110, '#ff5a3c', 0.6); x.fillStyle = '#ff7a4a'; x.beginPath(); x.arc(0, 0, 58, 0, TAU); x.arc(0, 0, 20, 0, TAU, true); x.fill('evenodd');
    x.fillStyle = '#3a1f55'; for (let k = 0; k < 6; k++) { const a = (k * TAU) / 6; x.beginPath(); x.arc(Math.cos(a) * 40, Math.sin(a) * 40, 6, 0, TAU); x.fill(); }
    x.strokeStyle = 'rgba(255,190,120,0.8)'; x.lineWidth = 5; x.lineCap = 'round';
    for (let k = -1; k <= 1; k++) { x.beginPath(); for (let i = 0; i <= 12; i++) { const yy = -64 - i * 3, xx = k * 22 + Math.sin(i * 0.9 + t * 6) * 5; i ? x.lineTo(xx, yy) : x.moveTo(xx, yy); } x.stroke(); }
    x.restore();
    badge(x, hc[0] + 64, hc[1] - 62, 24, false, back(S(t, 105.8, 106.1), 2.2) * (1 - S(t, 107.4, 107.8)));
  }
  labelTag(x, 0.5 * W, 0.2 * H_, 'REGENERATIVE BRAKING', TG.green, { px: 32, rot: -0.03, s: popAt(t, 107.07, 0.4, 2) * (1 - S(t, 108.3, 108.6)) });
}

// ================= S6: what it proved (108.6 - 130.5) =================
const CAR6 = { cx: 0.6 * 1280, gy: 0.9 * 720, w: 0.4 * 1280 };
function s6(x, W, H_, t) {
  const sc = 380 * (t - 108.6), drive = Math.pow(S(t, 128.9, 130.5), 2), car = { ...CAR6, cx: CAR6.cx + 1000 * drive };
  road(x, W, H_, t, PAL.pink, sc);
  roadster(x, car.cx, car.gy, car.w, { t, spin: (sc + car.cx) / (0.075 * car.w), speed: 0.35 + 0.6 * S(t, 128.9, 129.4), lights: 1, glowBat: 0 });
  // range and sales tags (top-right, they count up in place)
  const o1 = 1 - S(t, 121.9, 122.3);
  labelTag(x, 0.85 * W, 0.135 * H_, Math.round(244 * eio(S(t, 111.77, 113.4))) + ' MI', TAGC.orange, { px: 34, s: popAt(t, 109.2, 0.35, 2) * o1 });
  labelTag(x, 0.85 * W, 0.255 * H_, Math.round(2450 * eio(S(t, 114.5, 116.2))).toLocaleString('en-US') + ' SOLD', TAGC.violet, { px: 30, s: popAt(t, 114.1, 0.35, 2) * o1 });
  // fast, practical, thrilling
  [[120.04, 'FAST', TAGC.pink, 0.42, 0.44, -0.06], [120.5, 'PRACTICAL', TAGC.cyan, 0.6, 0.36, 0.04], [121.5, 'THRILLING', TAGC.orange, 0.78, 0.46, -0.04]].forEach(([t0, lab, col, X, Y, rot]) =>
    labelTag(x, X * W, Y * H_, lab, col, { px: 32, rot, s: popAt(t, t0, 0.35, 2.2) * (1 - S(t, 122.0, 122.3)) }));
  // presenter
  if (t > 117.5) {
    const px = lerp(-160, 0.13 * W, eo(S(t, 117.5, 118.4)));
    const pose = t > 127.2 ? { ...POSES.waving, L: [22 + 4 * Math.sin(t * 8), -92, 4] } : poseAt([[117.5, 'presenting'], [121.2, 'presenting'], [121.7, 'thumbsUp']], t);
    presenter(x, px, 0.95 * H_, 300, t, pose, 'happy');
  }
  // the loop: battery -> inverter -> motor -> back again; then it folds into the car
  if (t > 122.2) {
    const k = eio(S(t, 127.3, 128.6)), bp = carPt(car, LOC.bat), c0 = [0.62 * W, 0.34 * H_], c = [lerp(c0[0], bp[0], k), lerp(c0[1], bp[1], k)], sc2 = lerp(1, 0.05, k);
    if (sc2 > 0.06) {
      x.save(); x.translate(...c); x.scale(sc2, sc2); x.translate(-c[0], -c[1]); x.globalAlpha *= 1 - S(t, 128.3, 128.6);
      const R = 130, A = { bat: Math.PI * 5 / 6, inv: -Math.PI / 2, mot: Math.PI / 6 }, d = 0.42, pulse = 1 + 0.08 * Math.sin(Math.PI * S(t, 126.79, 127.3));
      glow(x, c[0], c[1], 260 * pulse, '#ffffff', 0.25 * S(t, 125.6, 126.0));
      arrow(x, arcPts(c, R, A.bat + d, A.inv + TAU - d), eio(S(t, 122.9, 123.4)), '#ffffff', 10, { dots: true });
      arrow(x, arcPts(c, R, A.inv + d, A.mot + TAU - d), eio(S(t, 123.6, 124.3)), '#ffffff', 10, { dots: true });
      arrow(x, arcPts(c, R, A.mot + d, A.bat - d), eio(S(t, 125.27, 125.9)), '#38e08e', 12, { dots: true });
      const node = (a) => [c[0] + R * Math.cos(a), c[1] + R * Math.sin(a)];
      const nb = node(A.bat), ni = node(A.inv), nm = node(A.mot);
      let s = popAt(t, 122.58, 0.35, 1.8); if (s > 0.01) { x.save(); x.translate(...nb); x.scale(s * pulse, s * pulse); batteryIcon(x, 0, 0, 96, 50, 0.8, { ga: 0.3 }); x.restore(); }
      s = popAt(t, 123.24, 0.35, 1.8); if (s > 0.01) { x.save(); x.translate(...ni); x.scale(s * pulse * 0.45, s * pulse * 0.45); inverterBox(x, 0, 0, 220, 150, t, 1, 0.3); x.restore(); }
      s = popAt(t, 124.23, 0.35, 1.8); if (s > 0.01) { x.save(); x.translate(...nm); x.scale(s * pulse, s * pulse); motorIcon(x, 0, 0, 44, t * 4, 0.3); x.restore(); }
      x.restore();
    }
  }
}

// ================= director: scenes + transitions =================
const CHAPTERS = [[10.0, '2008', TAGC.orange], [18.3, 'BATTERY', TAGC.cyan], [47.8, 'INVERTER', TAGC.pink], [73.0, 'MOTOR', TAGC.violet], [92.6, 'REGEN', TG.green], [108.6, 'TESLA ROADSTER', TAGC.orange]];
function chapterTag(x, t) {
  let i = -1; CHAPTERS.forEach((c, k) => { if (t >= c[0]) i = k; }); if (i < 0) return;
  const [t0, lab, col] = CHAPTERS[i], next = CHAPTERS[i + 1] ? CHAPTERS[i + 1][0] : 1e9;
  barTag(x, lab, col, { w: 0.1 + lab.length * 0.017, s: S(t, t0, t0 + 0.5), a: 1 - S(t, next - 0.3, next), px: 28 });
}
function explainer(x, W, H_, t) {
  if (t < 18.3) s1(x, W, H_, t);
  else if (t < 47.6) s2(x, W, H_, t);
  else if (t < 48.4) { s2(x, W, H_, t); COMP.wipe.diag(x, S(t, 47.6, 48.4), () => s3(x, W, H_, t), W, H_); }
  else if (t < 73.0) s3(x, W, H_, t);
  else if (t < 78.0) s4(x, W, H_, t);
  else if (t < 78.9) { s4(x, W, H_, t); COMP.wipe.diag(x, S(t, 78.0, 78.9), () => chart(x, W, H_, t), W, H_); }
  else if (t < 87.5) chart(x, W, H_, t);
  else if (t < 88.3) { chart(x, W, H_, t); COMP.wipe.iris(x, S(t, 87.5, 88.3), 0.14 * W, 0.8 * H_, () => speedo(x, W, H_, t), W, H_); }
  else if (t < 92.5) speedo(x, W, H_, t);
  else if (t < 93.3) COMP.wipe.slide(x, S(t, 92.5, 93.3), 'r', () => speedo(x, W, H_, t), () => s5(x, W, H_, t), W, H_);
  else if (t < 108.6) s5(x, W, H_, t);
  else s6(x, W, H_, t);
  // dive-in blooms hide the two scene swaps (into the battery, into the motor)
  COMP.wipe.bloom(x, S(t, 17.8, 18.8), W / 2, H_ / 2, '#e8fbff', W, H_, 1);
  COMP.wipe.bloom(x, S(t, 72.5, 73.5), W / 2, H_ / 2, '#f0e6ff', W, H_, 1);
  chapterTag(x, t);
}

// ======================================================================================================
// GLUE (do not edit): EngineX seeks the page to each frame and fires hf-seek; every frame is a pure function of t.
// ======================================================================================================
const LW = 1280, LH = 720;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DPR = window.devicePixelRatio || 1;
cv.width = Math.round(1920 * DPR); cv.height = Math.round(1080 * DPR);
function frame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(cv.width / LW, 0, 0, cv.height / LH, 0, 0);
  explainer(ctx, LW, LH, t);
  finish(ctx, LW, LH, t);
}
const FONT_SPECS = ['900 96px "Nunito"', '800 44px "Nunito"', '700 28px "Nunito"'];
window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
window.__hf.buildReady.fonts = Promise.all(FONT_SPECS.map((f) => document.fonts.load(f, 'AaZz09,%?'))).then(() => frame(0));
window.addEventListener('hf-seek', (e) => frame(e.detail.time));
window.seek = frame; window.DURATION = DURATION;
frame(0);
</script>
